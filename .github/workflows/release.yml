name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, such as 0.1.0"
        required: true
        type: string
      create_release:
        description: "Create or update a GitHub Release"
        required: false
        default: false
        type: boolean
      run_app_smoke:
        description: "Launch the app on the runner before packaging"
        required: false
        default: false
        type: boolean
      notarize:
        description: "Use Apple Developer ID signing and notarization"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release package
    runs-on: macos-26

    env:
      MIN_RELEASE_MACOS_SDK_MAJOR: "26"
      INPUT_VERSION: ${{ github.event.inputs.version || '' }}
      INPUT_CREATE_RELEASE: ${{ github.event.inputs.create_release || 'false' }}
      INPUT_RUN_APP_SMOKE: ${{ github.event.inputs.run_app_smoke || 'false' }}
      INPUT_NOTARIZE: ${{ github.event.inputs.notarize || 'auto' }}
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce main release branch
        shell: bash
        run: |
          set -euo pipefail

          release_branch="main"
          git fetch --no-tags --prune origin \
            "+refs/heads/$release_branch:refs/remotes/origin/$release_branch"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$release_branch"; then
              echo "::error::Release tags must point to a commit on origin/$release_branch."
              exit 2
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" \
            && "$INPUT_CREATE_RELEASE" == "true" ]]; then
            if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "$release_branch" ]]; then
              echo "::error::Manual GitHub Release creation must run from $release_branch."
              exit 2
            fi
          fi

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
            create_release="true"
          else
            version="$INPUT_VERSION"
            tag="v$version"
            create_release="$INPUT_CREATE_RELEASE"
          fi

          if [[ -z "$version" ]]; then
            echo "::error::Provide a version input or push a v* tag."
            exit 2
          fi

          if [[ ! "$version" =~ ^[0-9]+([.][0-9]+){0,2}$ ]]; then
            echo "::error::Release version must look like 0.1.0."
            exit 2
          fi

          case "$INPUT_NOTARIZE" in
            auto|true|false) ;;
            *)
              echo "::error::notarize must be auto, true, or false."
              exit 2
              ;;
          esac

          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "create_release=$create_release" >>"$GITHUB_OUTPUT"
          echo "run_app_smoke=$INPUT_RUN_APP_SMOKE" >>"$GITHUB_OUTPUT"
          echo "notarize=$INPUT_NOTARIZE" >>"$GITHUB_OUTPUT"

      - name: Resolve signing mode
        id: release_mode
        shell: bash
        run: |
          set -euo pipefail

          has_signing_identity=false
          has_notary_credentials=false
          signing_enabled=false
          notarize_enabled=false

          if [[ -n "$APPLE_CERTIFICATE_P12_BASE64" \
            && -n "$APPLE_CERTIFICATE_PASSWORD" \
            && -n "$CODESIGN_IDENTITY" ]]; then
            has_signing_identity=true
            signing_enabled=true
          fi

          if [[ -n "$APPLE_ID" \
            && -n "$APPLE_TEAM_ID" \
            && -n "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            has_notary_credentials=true
          fi

          case "${{ steps.meta.outputs.notarize }}" in
            true)
              if [[ "$has_signing_identity" != "true" ]]; then
                echo "::error::notarize=true requires APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD, and CODESIGN_IDENTITY secrets."
                exit 2
              fi
              if [[ "$has_notary_credentials" != "true" ]]; then
                echo "::error::notarize=true requires APPLE_ID, APPLE_TEAM_ID, and APPLE_APP_SPECIFIC_PASSWORD secrets."
                exit 2
              fi
              notarize_enabled=true
              ;;
            auto)
              if [[ "$has_signing_identity" == "true" \
                && "$has_notary_credentials" == "true" ]]; then
                notarize_enabled=true
              else
                echo "::notice::Developer ID notarization is disabled because one or more Apple release secrets are missing."
              fi
              ;;
            false)
              ;;
          esac

          if [[ "$signing_enabled" == "true" && "$notarize_enabled" != "true" ]]; then
            echo "::notice::Release will be Developer ID signed but not notarized."
          elif [[ "$signing_enabled" != "true" ]]; then
            echo "::notice::Release will use ad hoc signing."
          fi

          echo "signing_enabled=$signing_enabled" >>"$GITHUB_OUTPUT"
          echo "notarize_enabled=$notarize_enabled" >>"$GITHUB_OUTPUT"

      - name: Show Swift toolchain
        run: |
          swift --version
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --show-sdk-path

      - name: Verify release SDK
        shell: bash
        run: |
          set -euo pipefail

          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          sdk_major="${sdk_version%%.*}"

          if (( sdk_major < MIN_RELEASE_MACOS_SDK_MAJOR )); then
            echo "::error::Release builds must link against macOS SDK ${MIN_RELEASE_MACOS_SDK_MAJOR}.x or newer; found $sdk_version."
            exit 2
          fi

      - name: Verify release build
        run: ./script/verify.sh --clean --release

      - name: Smoke test release app
        if: steps.meta.outputs.run_app_smoke == 'true'
        run: |
          VERIFY_TIMEOUT_SECONDS=20 \
          SWIFT_WARNINGS_AS_ERRORS=1 \
          ./script/build_and_run.sh --verify --release

      - name: Import Developer ID certificate
        if: steps.release_mode.outputs.signing_enabled == 'true'
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/codex-keyring-signing.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" \
            | /usr/bin/base64 --decode >"$certificate_path"

          /usr/bin/security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain_path"
          /usr/bin/security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          /usr/bin/security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -k "$keychain_path"
          /usr/bin/security list-keychains -d user -s "$keychain_path"
          /usr/bin/security default-keychain -s "$keychain_path"
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          /usr/bin/security find-identity -v -p codesigning "$keychain_path"

      - name: Package release
        env:
          SPARKLE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY || secrets.SPARKLE_PUBLIC_ED_KEY || '' }}
          SPARKLE_REQUIRED: ${{ steps.meta.outputs.create_release }}
        shell: bash
        run: |
          set -euo pipefail

          package_env=(
            "APP_VERSION=${{ steps.meta.outputs.version }}"
            "APP_BUILD=$GITHUB_RUN_NUMBER"
            "SWIFT_WARNINGS_AS_ERRORS=1"
          )

          if [[ "${{ steps.release_mode.outputs.signing_enabled }}" == "true" ]]; then
            package_env+=(
              "CODESIGN_IDENTITY=$CODESIGN_IDENTITY"
              "AD_HOC_SIGN=0"
            )
          fi

          if [[ "${{ steps.release_mode.outputs.notarize_enabled }}" == "true" ]]; then
            package_env+=(
              "NOTARIZE_RELEASE=1"
              "APPLE_ID=$APPLE_ID"
              "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
            )
          fi

          env "${package_env[@]}" ./script/package_release.sh

      - name: Verify release artifacts
        run: |
          set -euo pipefail

          cd dist/release
          /usr/bin/shasum -a 256 -c *.sha256
          /bin/ls -lh

      - name: Generate Sparkle appcast
        if: steps.meta.outputs.create_release == 'true'
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          APPCAST_DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/
        run: ./script/generate_appcast.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexKeyring-${{ steps.meta.outputs.version }}-macOS
          path: |
            dist/release/*.zip
            dist/release/*.sha256
            dist/release/appcast.xml
            dist/release/*.delta
            dist/release/*release-notes.md

      - name: Create GitHub Release
        if: steps.meta.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          tag="${{ steps.meta.outputs.tag }}"

          notes_file="dist/release/CodexKeyring-$RELEASE_VERSION-release-notes.md"
          assets=(
            dist/release/*.zip
            dist/release/*.sha256
            dist/release/*release-notes.md
            dist/release/appcast.xml
            dist/release/*.delta
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "Codex Keyring $RELEASE_VERSION" \
              --notes-file "$notes_file" \
              --target "$GITHUB_SHA"
          fi

      - name: Delete signing keychain
        if: always() && steps.release_mode.outputs.signing_enabled == 'true'
        run: /usr/bin/security delete-keychain "$RUNNER_TEMP/codex-keyring-signing.keychain-db" || true
