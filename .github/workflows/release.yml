name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, such as 0.1.0"
        required: true
        type: string
      create_release:
        description: "Create or update a GitHub Release"
        required: false
        default: false
        type: boolean
      run_app_smoke:
        description: "Launch the app on the runner before packaging"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build release package
    runs-on: macos-15

    env:
      INPUT_VERSION: ${{ github.event.inputs.version || '' }}
      INPUT_CREATE_RELEASE: ${{ github.event.inputs.create_release || 'false' }}
      INPUT_RUN_APP_SMOKE: ${{ github.event.inputs.run_app_smoke || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            create_release="true"
          else
            version="$INPUT_VERSION"
            create_release="$INPUT_CREATE_RELEASE"
          fi

          if [[ -z "$version" ]]; then
            echo "::error::Provide a version input or push a v* tag."
            exit 2
          fi

          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "create_release=$create_release" >>"$GITHUB_OUTPUT"
          echo "run_app_smoke=$INPUT_RUN_APP_SMOKE" >>"$GITHUB_OUTPUT"

      - name: Show Swift toolchain
        run: swift --version

      - name: Verify release build
        run: ./script/verify.sh --clean --release

      - name: Smoke test release app
        if: steps.meta.outputs.run_app_smoke == 'true'
        run: |
          VERIFY_TIMEOUT_SECONDS=20 \
          SWIFT_WARNINGS_AS_ERRORS=1 \
          ./script/build_and_run.sh --verify --release

      - name: Package release
        run: |
          APP_VERSION="${{ steps.meta.outputs.version }}" \
          APP_BUILD="$GITHUB_RUN_NUMBER" \
          ./script/package_release.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexKeyring-${{ steps.meta.outputs.version }}-macOS
          path: |
            dist/release/*.zip
            dist/release/*.sha256
            dist/release/*release-notes.md

      - name: Create GitHub Release
        if: steps.meta.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$RELEASE_VERSION"
          fi

          notes_file="dist/release/CodexKeyring-$RELEASE_VERSION-release-notes.md"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/*.zip dist/release/*.sha256 --clobber
          else
            gh release create "$tag" dist/release/*.zip dist/release/*.sha256 \
              --title "Codex Keyring $RELEASE_VERSION" \
              --notes-file "$notes_file" \
              --target "$GITHUB_SHA"
          fi
