name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Swift package
    runs-on: macos-26
    timeout-minutes: 20

    env:
      VERIFY_SWIFT_TEST_TIMEOUT_SECONDS: "600"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Verify package
        run: bash ./script/verify.sh
